[discovery]
coverage = "all_aligned"
# Immutable source bindings, not inferred hardware-packet callbacks:
# reset $628/$62c installs task 0 from $1746; $4380/$4384 installs task 4
# ($1756 -> $28d2e), and $4368/$436c installs task 10 ($176e -> $25d8a).
# $294ec..$2ee72 stage 20-byte source records with literal compiler pointers;
# $2910e/$29168/$291f4 restore their D4,D5,D2,D3,D6,A1 register ABI.
# $27568/$27582, $27bde/$27be2 and $28a6e/$28a72 register the three
# source-record effects through $29454. Preserve native all-aligned coverage.
entry_points = [
    0x44d8, 0x28d2e, 0x25d8a, 0x275a0, 0x27be8, 0x28a78,
    0x323f6, 0x32404, 0x32422, 0x32446, 0x3247c, 0x324dc,
    0x32542, 0x3257e, 0x325e4, 0x32652, 0x32686, 0x326e4,
]
# Every site extracts tagged descriptor-pointer bits 30..31 via ROL.L #4
# and ANDI.W #$000c. The same four immutable long pointers at $32748
# select no flip / Y flip / X flip / XY flip. Nested dimension tables lack
# a source-code bounds clamp and are deliberately not promoted here.
jump_tables = [
    { address = 0x32472, table = 0x32748, count = 4 },
    { address = 0x324d4, table = 0x32748, count = 4 },
    { address = 0x3253a, table = 0x32748, count = 4 },
    { address = 0x32576, table = 0x32748, count = 4 },
    { address = 0x325dc, table = 0x32748, count = 4 },
    { address = 0x32648, table = 0x32748, count = 4 },
    { address = 0x3267e, table = 0x32748, count = 4 },
    { address = 0x326dc, table = 0x32748, count = 4 },
    { address = 0x32740, table = 0x32748, count = 4 },
]

