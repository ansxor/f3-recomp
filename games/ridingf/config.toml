[discovery]
coverage = "all_aligned"
# ROM vector $6c -> $7c8e; $7ca8 JSR $2e18; $2e58 JSR $e4ee.
# Active object bit 6 selects projection; bit 5 additionally orders $ee9e
# before $ed94, then $e5fe BSR $e71a. A6 is the original 0x80-byte slot,
# never a decoded hardware packet. Keep native all-aligned coverage.
entry_points = [0xe4ee, 0xe71a, 0xed94, 0xee9e]
# These five sites mask flip flags to two bits and multiply by four
# before loading one of exactly four immutable pointers. $ee7c chooses
# descriptor traversal start; $ee8c chooses row traversal step. The sixth
# composite-row site $ed32 XORs an unmasked descriptor byte after masking
# the object: do not promote its table without proving the live asset set.
# Fade tables at $1359e/$135c6 have no bounded index clamp: not promoted.
jump_tables = [
    { address = 0xe854, table = 0xee7c, count = 4 },
    { address = 0xe90c, table = 0xee8c, count = 4 },
    { address = 0xea56, table = 0xee7c, count = 4 },
    { address = 0xeb0e, table = 0xee8c, count = 4 },
    { address = 0xec5a, table = 0xee7c, count = 4 },
]

