[discovery]
coverage = "all_aligned"
# Reset 0x628 clears task ID at A5-0x7a72; 0x69b0/0x69b6 trap #1
# starts ID 0. Handler 0x6472/0x6478 reads its PC from 0x3080 = 0x3084.
# Rooted trap #13 sites push the literal first longword below. Vector 0xb4
# points to 0x6542; 0x6580/0x6584 installs that longword as saved task PC.
# Sites: 30ae,3d22,312a,2556,256e,258e,25a6,25be,3310,508a,50de,
# 23f2c,275e,23fde,23ff6,2400e,24026,241e4,24590,2d7fa.
entry_points = [0x3084, 0x3d08, 0x6b12, 0x2494, 0x33a98, 0x24296,
                0x2fcc4, 0x26262, 0x993a, 0x5032, 0x23e28, 0xab5a,
                0x25326, 0x23e80, 0x3038c, 0x25430, 0x30c94, 0x2a334,
                0x2c42a, 0x24c96, 0x2d82a]
# Sprite compiler dispatch: index is (object byte[0] & 3)*4.
# A0 tile cursor setup and next-row stepping are distinct four-entry tables.
[[discovery.jump_tables]]
address = 0x9c76
table = 0xa30e
count = 4
[[discovery.jump_tables]]
address = 0x9d2a
table = 0xa31e
count = 4
[[discovery.jump_tables]]
address = 0x9e80
table = 0xa30e
count = 4
[[discovery.jump_tables]]
address = 0x9f2c
table = 0xa31e
count = 4
[[discovery.jump_tables]]
address = 0xa094
table = 0xa30e
count = 4
# Composite row dispatch additionally XORs component flags. All ROM
# composites in the 0x1800-entry descriptor table 0x5a02c..0x6002c have
# flags 0..3; six RAM descriptors have cleared first bytes (simple grids).
[[discovery.jump_tables]]
address = 0xa180
table = 0xa31e
count = 4

