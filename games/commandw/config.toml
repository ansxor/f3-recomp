[video]
# MAME f3_224b: visible x=46..365, y=32..255; extended playfields enabled.
# https://github.com/mamedev/mame/blob/cfc4760a3be9c5a79846b19b6a573cb38459fa7e/src/mame/taito/taito_f3_v.cpp#L319-L325
# Both high planes are present; sprite commands and tile attributes select 4/5/6bpp.
# No fixed per-game pen masks exist in the pinned driver.
rotation = 0
sprite_lag = 1
extend = true
# User-requested per-scanline half-map selection follows the ROM's 0x4868
# 64-column format: normal PF3 at 0x616000, half at 0x61a000, clear at 0x618000.
# Its first 144 line words are 0x3200 (selector 0x0200); this is a source/layout
# contract, not a claim that pinned MAME enables alternates in extended mode.
extended_alt_maps = true
visible_y = 32
visible_height = 224

# Asset-research inputs consumed by tools/discover_prescaled_tiles.py; not a
# renderer profile or hardware alt-selection override. Header ABI at 0x4868
# is byte DBRA maxima + row-major u16 tile IDs, not the GameTiles hook ABI.
[prescaled_tiles]
descriptor_format = "byte_dbra_u16be"
# 0x263b4..0x26430 places all 24 normal/12 alternate 4x4 descriptors.
# Exhaustive six-plane pixel research proves X2/Y1 for this complete grid.
[[prescaled_tiles.pairs]]
name = "overlay"
scale_x = 2
scale_y = 1
pen_mask = 63
evidence_pcs = [0x263b4, 0x263d4, 0x263f4, 0x26414, 0x26510]
condition = "signed byte[A5-0x704f] <= 0; positive state replaces normal tiles at 0x2643c"
normal = { table = 0x2652e, records = 24, columns = 6, origin_pixels = [0, 0], destinations = [0x616000, 0x617000] }
half = { table = 0x265be, records = 12, columns = 3, origin_pixels = [112, 0], destinations = [0x61a01c, 0x61b01c] }

# 0x26336..0x263a6 repeats these 4x4 descriptors over sixteen by eight
# placements. Pixel research proves actual periods normal64x64, half32x64.
[[prescaled_tiles.pairs]]
name = "repeated_base"
scale_x = 2
scale_y = 1
pen_mask = 63
evidence_pcs = [0x26348, 0x26382, 0x26360, 0x26368, 0x2639a, 0x263a2]
condition = "word[A5-0x750c] == 2 and word[A5-0x72da] == 0"
normal = { descriptor = 0x89588, columns = 1, attribute = 0x12, origin_pixels = [0, 0], destinations = [0x616000], repeat_descriptors = [16, 8] }
half = { descriptor = 0x897a8, columns = 1, attribute = 0x12, origin_pixels = [0, 0], destinations = [0x61a000], repeat_descriptors = [16, 8] }

# 0x278c0..0x2794a uploads all 64 records per selection twice. Every half
# tile has an exact X2/Y1 adjacent-full-tile pixel alias, but the whole-map
# coordinate transform is NOT exact for every selection; report contexts.
[[prescaled_tiles.pairs]]
name = "dual_nonpositive"
scale_x = 2
scale_y = 1
pen_mask = 63
evidence_pcs = [0x278ca, 0x278d8, 0x278f4, 0x2790c, 0x2791a, 0x27936]
condition = "signed byte[A5-0x704f] <= 0; selection=word[A5-0x750c]*3+word[A5-0x72da]"
normal = { pointer_table = 0x27ad8, selections = 9, records = 64, columns = 8, origin_pixels = [32, 0], destinations = [0x616008, 0x616088], duplicate_x_pixels = 512 }
half = { pointer_table = 0x27b20, selections = 9, records = 64, columns = 8, origin_pixels = [0, 0], destinations = [0x61a000, 0x61a080], duplicate_x_pixels = 512 }

# 0x2796e..0x27a22 repeats two rows four times, restoring the source cursor
# before each two-row pass. Different placement origin from the previous pair.
[[prescaled_tiles.pairs]]
name = "dual_positive"
scale_x = 2
scale_y = 1
pen_mask = 63
evidence_pcs = [0x2796e, 0x27978, 0x279a0, 0x279c8, 0x279d2, 0x279fa]
condition = "signed byte[A5-0x704f] > 0; same nine selection records"
normal = { pointer_table = 0x27ab4, selections = 9, records = 16, columns = 8, origin_pixels = [32, 0], destinations = [0x616008, 0x616088], duplicate_x_pixels = 512, repeat_rows = 4 }
half = { pointer_table = 0x27afc, selections = 9, records = 16, columns = 8, origin_pixels = [32, 0], destinations = [0x61a008, 0x61a088], duplicate_x_pixels = 512, repeat_rows = 4 }

# 0x2780c..0x278be independently selects these PF0/PF1 three-row tables.
# They are source contexts, not assumed normal/half variants of each other.
