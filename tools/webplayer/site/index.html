<!DOCTYPE html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Taito F3 Sound Bench · OTIS ES5505 / ES5510</title>
<style>
:root {
	--bg: #001810; --bg2: #082820; --bg3: #103830; --bga: #001008;
	--line: #185040; --line2: #287058; --silk: #e0f0d8; --dim: #88b8a0;
	--cu: #d08840; --gold: #f8c830; --hot: #f04830; --cyan: #48d8e0;
	--mono: ui-monospace, "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
	background: var(--bg); color: var(--silk); font-family: var(--mono); font-size: 11px;
	height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}
button, select, input { font: inherit; color: inherit; background: transparent; border: none; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

/* -------------------------------- top bar */
header {
	background: var(--bg2); border-bottom: 1px solid var(--line);
	display: flex; align-items: center; gap: 8px; padding: 4px 10px; height: 44px; flex-shrink: 0;
}
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--gold); text-transform: uppercase; }
.brand .chip-id { font-size: 9px; color: var(--dim); border: 1px solid var(--line2); padding: 1px 4px; border-radius: 2px; }
.gsel select {
	background: var(--bg); border: 1px solid var(--line2); color: var(--silk);
	padding: 2px 6px; border-radius: 2px; font-size: 11px; max-width: 260px;
}
.gsel select option { background: var(--bg); }
.hud {
	display: flex; align-items: center; gap: 6px; margin-left: auto; background: var(--bga);
	padding: 2px 8px; border: 1px solid var(--line); border-radius: 2px;
}
.hud-item { display: flex; flex-direction: column; align-items: flex-end; }
.hud-item label { font-size: 8px; color: var(--dim); letter-spacing: 0.05em; text-transform: uppercase; }
.lcd { display: inline-flex; align-items: center; }
.lcd svg { display: block; }
.lcd .ghost { fill: #002818; }
.lcd .lit { fill: var(--gold); }
#loopbadge {
	font-size: 9px; font-weight: 700; letter-spacing: 0.05em; padding: 1px 5px;
	border: 1px solid var(--cu); color: var(--cu); border-radius: 2px; text-transform: uppercase;
}
#loopbadge[data-iter="repeat"] { background: var(--cu); color: var(--bg); }
#secread { font-size: 9px; color: var(--dim); min-width: 72px; }

/* transport */
.trans { display: flex; align-items: center; gap: 3px; }
.tbtn {
	width: 28px; height: 28px; border: 1px solid var(--line2); background: var(--bg3);
	color: var(--silk); border-radius: 2px; display: inline-flex; align-items: center; justify-content: center;
}
.tbtn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.tbtn:disabled { opacity: 0.35; cursor: default; }
.tbtn svg { width: 14px; height: 14px; fill: currentColor; }
.tbtn[aria-pressed=true] { background: var(--gold); color: var(--bg); border-color: var(--gold); }
#seekbar { width: 80px; height: 4px; accent-color: var(--gold); }

/* -------------------------------- fatal banner */
#fatal {
	background: var(--hot); color: #f8f8f8; padding: 6px 12px; font-size: 11px;
	font-weight: 700; border-bottom: 1px solid var(--bg); flex-shrink: 0;
}

/* -------------------------------- workspace */
#work { display: flex; flex: 1; min-height: 0; overflow: hidden; position: relative; }

/* -------------------------------- sidebar (song list) */
#sidebar {
	width: 240px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--line);
	display: flex; flex-direction: column; min-height: 0;
}
.sidehead {
	padding: 6px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;
}
.sidehead input {
	background: var(--bg); border: 1px solid var(--line); color: var(--silk);
	padding: 3px 6px; border-radius: 2px; font-size: 10px; width: 100%;
}
.sidehead .sub { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); }
#songlist { list-style: none; overflow-y: auto; flex: 1; min-height: 0; }
#songlist li button {
	width: 100%; text-align: left; padding: 4px 8px; display: grid;
	grid-template-columns: 8px 1fr auto auto; gap: 6px; align-items: baseline;
	border-bottom: 1px solid #082018; font-size: 10px;
}
#songlist li button:hover { background: var(--bg3); }
#songlist li button[aria-current=true] { background: var(--bg); color: var(--gold); }
#songlist .pad {
	width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--cu);
	display: inline-block; align-self: center;
}
#songlist li button[aria-current=true] .pad { background: var(--gold); border-color: var(--gold); }
#songlist .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#songlist .du { font-size: 9px; color: var(--dim); }
#songlist .lp { color: var(--cu); font-size: 11px; line-height: 1; }

/* -------------------------------- main center (timeline) */
#center { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.tlbar {
	height: 30px; background: var(--bg2); border-bottom: 1px solid var(--line);
	display: flex; align-items: center; gap: 6px; padding: 0 8px; flex-shrink: 0; font-size: 10px;
}
.grp { display: inline-flex; align-items: center; gap: 2px; border-right: 1px solid var(--line); padding-right: 6px; }
.btn {
	padding: 2px 6px; border: 1px solid var(--line2); background: var(--bg3);
	color: var(--silk); border-radius: 2px; font-size: 10px;
}
.btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.btn:disabled { opacity: 0.35; cursor: default; }
.chk { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; color: var(--dim); }
.chk input { accent-color: var(--gold); }
.chk:hover { color: var(--silk); }
.sel-sm {
	background: var(--bg); border: 1px solid var(--line2); color: var(--silk);
	padding: 1px 4px; font-size: 10px; border-radius: 2px;
}
.tlbar-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
#zoomread { font-size: 9px; color: var(--dim); min-width: 64px; text-align: right; }

/* ruler */
#ruler-box {
	height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--line);
	display: flex; background: var(--bg2); position: relative; user-select: none;
}
.ruler-corner {
	width: 176px; flex-shrink: 0; border-right: 1px solid var(--line);
	display: flex; flex-direction: column; justify-content: space-between; padding: 4px 8px;
}
.ruler-corner b { font-size: 9px; letter-spacing: 0.08em; color: var(--dim); text-transform: uppercase; }
.ruler-corner small { font-size: 8px; color: var(--dim); }
#ruler { flex: 1; min-width: 0; display: block; cursor: crosshair; }

/* lanes container */
#tl { flex: 1; min-height: 0; position: relative; display: flex; overflow: hidden; }
#heads-col {
	width: 176px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--bg2);
	overflow: hidden; position: relative; user-select: none;
}
#heads { list-style: none; position: relative; width: 100%; }
.head {
	position: absolute; left: 0; width: 100%; border-bottom: 1px solid var(--line);
	padding: 4px 6px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.head.glob b { font-size: 10px; color: var(--gold); }
.head.glob small { font-size: 8px; color: var(--dim); }
.head.glob .leg { display: inline-flex; gap: 4px; font-size: 8px; margin-top: 2px; }
.head.glob .leg i { font-style: normal; font-weight: 700; }
.head.auto { padding-left: 20px; background: var(--bga); }
.head.auto b { font-size: 9px; color: var(--gold); }
.head.auto small { font-size: 8px; color: var(--dim); }
.head.trk { background: var(--bg2); }
.head.trk.sel { background: var(--bg3); }
.head.trk .tg {
	position: absolute; left: 2px; top: 6px; width: 14px; height: 14px;
	color: var(--dim); font-size: 9px; line-height: 14px; text-align: center;
}
.head.trk .tg:disabled { opacity: 0.15; cursor: default; }
.head.trk .nm {
	margin-left: 12px; font-weight: 700; font-size: 10px; text-align: left;
	color: var(--silk); letter-spacing: 0.03em;
}
.head.trk.sel .nm { color: var(--gold); }
.head.trk .meta { margin-left: 12px; font-size: 8px; color: var(--dim); }
.head.trk .chips { margin-left: 12px; display: inline-flex; gap: 2px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.chip { display: inline-block; width: 7px; height: 7px; border-radius: 1px; }
.pp { font-style: normal; font-size: 8px; font-weight: 700; margin-left: 2px; }

#lanes { flex: 1; min-width: 0; position: relative; overflow: hidden; background: var(--bg); }
#space { width: 1px; }
#stage {
	position: absolute; left: 0; top: 0; width: 100%; cursor: default;
	outline: none; user-select: none; touch-action: none;
}
#stage.grab { cursor: grabbing; }
#roll, #cur { position: absolute; left: 0; top: 0; pointer-events: none; }

/* scrollbar */
#sb-track {
	position: absolute; right: 0; top: 0; bottom: 0; width: 8px;
	background: var(--bg2); border-left: 1px solid var(--line);
}
#sb-thumb {
	position: absolute; left: 1px; width: 6px; background: var(--line2);
	border-radius: 2px; cursor: pointer;
}
#sb-thumb:hover { background: var(--gold); }

/* tooltip */
#tip {
	position: absolute; z-index: 10; pointer-events: none; background: #001008f0;
	border: 1px solid var(--gold); color: var(--silk); padding: 4px 8px;
	font-size: 10px; border-radius: 2px; white-space: pre-line; box-shadow: 0 4px 12px #000800;
}

/* empty overlay */
#empty[hidden] { display: none; }
#empty {
	position: absolute; inset: 0; background: #001810e0; display: flex;
	align-items: center; justify-content: center; z-index: 5; text-align: center; padding: 20px;
}
#empty p { max-width: 380px; color: var(--dim); font-size: 12px; line-height: 1.5; }

/* -------------------------------- right inspector */
#insp {
	width: 340px; flex-shrink: 0; background: var(--bg2); border-left: 1px solid var(--line);
	display: flex; flex-direction: column; min-height: 0;
}
.tabs-nav {
	display: flex; border-bottom: 1px solid var(--line); background: var(--bg); flex-shrink: 0;
}
.tabs-nav label {
	flex: 1; text-align: center; padding: 6px 4px; font-size: 10px; color: var(--dim);
	cursor: pointer; border-bottom: 2px solid transparent; letter-spacing: 0.05em; text-transform: uppercase;
}
.tabs-nav label:hover { color: var(--silk); }
input[name="tab"] { position: absolute; opacity: 0; pointer-events: none; }
#t-note:checked ~ .tabs-nav label[for="t-note"],
#t-inst:checked ~ .tabs-nav label[for="t-inst"],
#t-mix:checked  ~ .tabs-nav label[for="t-mix"],
#t-song:checked ~ .tabs-nav label[for="t-song"] {
	color: var(--gold); border-bottom-color: var(--gold); background: var(--bg2); font-weight: 700;
}
.tab-pane { display: none; overflow-y: auto; flex: 1; min-height: 0; padding: 8px 10px; }
#t-note:checked ~ #note-body,
#t-inst:checked ~ #inst-body,
#t-mix:checked  ~ #mix-body,
#t-song:checked ~ #song-body { display: block; }

/* inspector contents */
.empty { color: var(--dim); font-size: 11px; padding: 20px 8px; text-align: center; }
.notehead { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
.notehead .big { font-size: 18px; color: var(--gold); }
.notehead .sub { font-size: 9px; color: var(--dim); }
.chipbtn {
	margin-left: auto; border: 1px solid var(--line2); padding: 1px 6px;
	border-radius: 2px; font-size: 9px; display: inline-flex; align-items: center; gap: 4px;
}
.chipbtn[aria-pressed=true] { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 1px; }

.kv { display: grid; grid-template-columns: 88px 1fr; gap: 3px 6px; font-size: 10px; margin: 4px 0 8px; }
.kv dt { color: var(--dim); text-transform: lowercase; }
.kv dd { color: var(--silk); word-break: break-all; }
.kv.keys dt { color: var(--gold); font-weight: 700; }

.route { background: var(--bga); border: 1px solid var(--line); padding: 6px; border-radius: 2px; margin-bottom: 8px; }
.route b { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
.route .rt { font-size: 10px; display: flex; align-items: center; gap: 4px; margin-top: 2px; }

.voices { list-style: none; display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.voices button {
	width: 100%; text-align: left; padding: 4px 6px; background: var(--bg);
	border: 1px solid var(--line); border-radius: 2px; font-size: 10px;
}
.voices button[aria-selected=true] { border-color: var(--gold); background: var(--bg3); }
.tag { font-size: 8px; border: 1px solid var(--line2); padding: 0 3px; border-radius: 2px; color: var(--dim); margin-left: 2px; }

#scope { display: block; width: 100%; border: 1px solid var(--line); background: var(--bga); margin: 6px 0; }
.peak { display: block; border: 1px solid var(--line); background: var(--bga); margin: 4px 0; }

.inst-list { list-style: none; display: flex; flex-direction: column; gap: 2px; margin: 6px 0; }
.inst-list button {
	width: 100%; text-align: left; padding: 3px 6px; background: var(--bg);
	border: 1px solid var(--line); border-radius: 2px; display: grid; grid-template-columns: 12px 64px 60px 1fr;
	gap: 6px; align-items: baseline; font-size: 10px;
}
.inst-list button[aria-pressed=true] { border-color: var(--gold); background: var(--bg3); }
.inst-list .k { color: var(--dim); font-size: 9px; }
.inst-list .n { font-size: 9px; color: var(--dim); text-align: right; }

.regions { list-style: none; display: flex; flex-direction: column; gap: 2px; margin: 4px 0; }
.regions button {
	width: 100%; text-align: left; padding: 2px 4px; background: var(--bg);
	border: 1px solid var(--line); display: flex; align-items: center; gap: 6px; font-size: 9px;
}
.regions button[aria-pressed=true] { border-color: var(--gold); }

.grid { width: 100%; border-collapse: collapse; font-size: 9px; margin: 4px 0; }
.grid th, .grid td { border: 1px solid var(--line); padding: 2px 4px; text-align: left; }
.grid th { color: var(--dim); background: var(--bg); font-weight: normal; }
.grid tr.click { cursor: pointer; }
.grid tr.click:hover { background: var(--bg3); }

.layer { border: 1px solid var(--line); background: var(--bga); padding: 4px 6px; margin: 4px 0; border-radius: 2px; }
.layer summary { cursor: pointer; font-weight: 700; color: var(--gold); font-size: 10px; }
.sub { margin: 4px 0 2px 8px; border-left: 2px solid var(--line2); padding-left: 6px; }
.sub summary { cursor: pointer; color: var(--dim); font-size: 9px; }
.envs { display: flex; gap: 4px; margin: 6px 0; overflow-x: auto; }
.envs figure { margin: 0; }
.envs figcaption { font-size: 8px; color: var(--dim); text-align: center; margin-top: 2px; }
.env { display: block; border: 1px solid var(--line); background: var(--bga); }

.wavebox { margin: 6px 0; background: var(--bga); border: 1px solid var(--line); padding: 6px; border-radius: 2px; }
.wave { display: block; width: 100%; border: 1px solid var(--line); cursor: crosshair; outline: none; }
.wave:focus-visible { border-color: var(--gold); }

.fxhead { display: flex; gap: 6px; align-items: baseline; margin: 4px 0; }
.pbars { display: flex; gap: 3px; height: 32px; align-items: flex-end; background: var(--bg); padding: 2px 4px; border: 1px solid var(--line); margin: 4px 0; }
.pbars span { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.pbars i { display: block; width: 100%; background: var(--cyan); border-radius: 1px 1px 0 0; min-height: 1px; }
.pbars small { font-size: 7px; color: var(--dim); margin-top: 1px; }

.fxlist { list-style: none; display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; max-height: 160px; overflow-y: auto; }
.fxlist button {
	width: 100%; text-align: left; padding: 2px 6px; background: var(--bg); border: 1px solid var(--line);
	display: grid; grid-template-columns: 50px 58px 1fr; gap: 6px; font-size: 9px; align-items: baseline;
}
.fxlist li.cur button { border-color: var(--gold); background: var(--bg3); }
.fxlist .t { color: var(--dim); }
.fxlist .d { color: var(--silk); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.path { padding-left: 16px; margin: 4px 0 8px; font-size: 10px; color: var(--silk); display: flex; flex-direction: column; gap: 2px; }

code.hex { font-size: 9px; color: var(--dim); word-break: break-all; display: block; padding: 2px 4px; background: var(--bg); border: 1px solid var(--line); }
.mini { padding: 1px 5px; border: 1px solid var(--line2); background: var(--bg3); font-size: 9px; border-radius: 2px; }
.mini:hover { border-color: var(--gold); color: var(--gold); }
.note { font-size: 8px; color: var(--dim); margin: 4px 0; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }

/* -------------------------------- bottom board (U31 OTIS / U23 ESP / DAC) */
#board {
	height: 116px; flex-shrink: 0; background: var(--bg2); border-top: 1px solid var(--line);
	display: flex; flex-direction: column; overflow: hidden; user-select: none;
}
#board-svg { width: 100%; height: 100%; display: block; }
.chip-rect { fill: #001810; stroke: #185040; stroke-width: 1; }
.silktxt { fill: #88b8a0; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
.silksub { fill: #487860; font-family: var(--mono); font-size: 8px; }
.trace { fill: none; stroke: #d08840; stroke-width: 1.5; stroke-linecap: round; opacity: 0.55; }
.trace-bus { fill: none; stroke: #185040; stroke-width: 1; }
.vc { stroke: #185040; stroke-width: 0.5; }
.vclbl { fill: #e0f0d8; font-family: var(--mono); font-size: 8px; text-anchor: middle; pointer-events: none; }
.m-bg { fill: #001008; stroke: #185040; stroke-width: 0.5; }
.m-bar { fill: #f8c830; }
.m-bar.r { fill: #48d8e0; }

/* -------------------------------- footer status bar */
footer {
	height: 20px; background: var(--bga); border-top: 1px solid var(--line);
	display: flex; align-items: center; padding: 0 10px; font-size: 9px; color: var(--dim); gap: 12px; flex-shrink: 0;
}
#status[data-kind=ok] { color: var(--silk); }
#status[data-kind=busy] { color: var(--gold); }
#status[data-kind=bad] { color: var(--hot); }
.ft-r { margin-left: auto; display: flex; gap: 8px; }

/* responsive overlay */
@media (max-width: 960px) {
	#sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 20; box-shadow: 4px 0 16px #000800; }
	#insp { position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; box-shadow: -4px 0 16px #000800; }
}
@media (prefers-reduced-motion: reduce) {
	* { transition: none !important; animation: none !important; }
}
</style>

		<g id=s9><polygon points="2,1 10,1 9,3 3,3" /><polygon points="2,2 4,3 2,8 1,9" /><polygon points="10,1 11,2 10,8 8,7" /><polygon points="3,8 9,8 8,10 4,10" /><polygon points="10,10 11,16 10,17 8,15" /><polygon points="2,17 10,17 9,15 3,15" /></g>
		<g id=sa><polygon points="2,1 10,1 9,3 3,3" /><polygon points="2,2 4,3 2,8 1,9" /><polygon points="10,1 11,2 10,8 8,7" /><polygon points="3,8 9,8 8,10 4,10" /><polygon points="2,10 4,11 2,16 1,17" /><polygon points="10,10 11,16 10,17 8,15" /></g>
		<g id=sb><polygon points="2,2 4,3 2,8 1,9" /><polygon points="3,8 9,8 8,10 4,10" /><polygon points="2,10 4,11 2,16 1,17" /><polygon points="10,10 11,16 10,17 8,15" /><polygon points="2,17 10,17 9,15 3,15" /></g>
		<g id=sc-hex><polygon points="2,1 10,1 9,3 3,3" /><polygon points="2,2 4,3 2,8 1,9" /><polygon points="2,10 4,11 2,16 1,17" /><polygon points="2,17 10,17 9,15 3,15" /></g>
		<g id=sd><polygon points="10,1 11,2 10,8 8,7" /><polygon points="3,8 9,8 8,10 4,10" /><polygon points="2,10 4,11 2,16 1,17" /><polygon points="10,10 11,16 10,17 8,15" /><polygon points="2,17 10,17 9,15 3,15" /></g>
		<g id=se><polygon points="2,1 10,1 9,3 3,3" /><polygon points="2,2 4,3 2,8 1,9" /><polygon points="3,8 9,8 8,10 4,10" /><polygon points="2,10 4,11 2,16 1,17" /><polygon points="2,17 10,17 9,15 3,15" /></g>

<header>
	<div class=brand>
		<h1>F3 Sound Bench</h1>
		<span class=chip-id>OTIS ES5505 · ESP ES5510</span>
	</div>
	<div class=gsel>
		<select id=game aria-label="Game sound set"></select>
	</div>
	<div class=trans>
		<button id=bplay class=tbtn type=button aria-label=Play title="Play (Space)"><svg><use href=#i-play></use></svg></button>
		<button id=bstop class=tbtn type=button aria-label=Stop title=Stop><svg><use href=#i-stop></use></svg></button>
		<progress id=seekbar value=0 max=1 hidden aria-label="Seeking progress"></progress>
	</div>
	<div class=hud>
		<div class=hud-item>
			<label>Code</label>
			<output id=lcd-code class=lcd data-label="Sound code"></output>
		</div>
		<div class=hud-item>
			<label>Bar</label>
			<output id=lcd-bar class=lcd data-label="Bar"></output>
		</div>
		<div class=hud-item>
			<label>Time</label>
			<output id=lcd-time class=lcd data-label="Time"></output>
		</div>
		<span id=loopbadge hidden></span>
		<span id=secread></span>
	</div>
	<button id=tgl-songs class=btn type=button title="Toggle songs list">Songs</button>
	<button id=tgl-board class=btn type=button title="Toggle bottom board view">Board</button>
	<button id=tgl-insp class=btn type=button title="Toggle inspector">Inspector</button>
</header>

<div id=fatal hidden role=alert></div>

<div id=work>
	<!-- left sidebar: song list -->
	<aside id=sidebar aria-label="Song browser">
		<div class=sidehead>
			<input id=filter type=search placeholder="Filter songs…" aria-label="Filter songs">
			<div class=sub>
				<span id=songcount>0 songs</span>
				<span>↻ loops</span>
			</div>
		</div>
		<ul id=songlist role=listbox aria-label="Song list"></ul>
	</aside>

	<!-- center: timeline / piano roll -->
	<main id=center>
		<div class=tlbar role=toolbar aria-label="Timeline controls">
			<div class=grp>
				<button id=zin class=btn type=button title="Zoom in (+)">+</button>
				<button id=zout class=btn type=button title="Zoom out (−)">−</button>
				<button id=zfit class=btn type=button title="Fit song (0)">Fit</button>
				<button id=zms class=btn type=button title="1 ms resolution (1)">1 ms</button>
			</div>
			<div class=grp>
				<button id=vin class=btn type=button title="Taller lanes (])">↕+</button>
				<button id=vout class=btn type=button title="Shorter lanes ([)">↕−</button>
				<select id=okeys class=sel-sm aria-label="Key range mode">
					<option value=fit>Keys: used</option>
					<option value=all>Keys: 21–108</option>
				</select>
			</div>
			<div class=grp>
				<label class=chk title="Follow playhead while playing (F)"><input id=ofollow type=checkbox checked> Follow</label>
				<label class=chk title="Hide channels with no notes in current song"><input id=ohideempty type=checkbox> Hide empty</label>
			</div>
			<div class=grp>
				<label class=chk title="Voice pitch curves over notes"><input id=opitch type=checkbox checked> Pitch</label>
				<label class=chk title="Voice glide path"><input id=oglide type=checkbox checked> Glide</label>
				<label class=chk title="Voice LFO output"><input id=olfo type=checkbox> LFO</label>
			</div>
			<div class=grp>
				<select id=ocolor class=sel-sm aria-label="Colour notes by">
					<option value=inst>Colour: Instrument</option>
					<option value=pair>Colour: Bus pair</option>
				</select>
			</div>
			<div class=tlbar-r>
				<output id=zoomread></output>
			</div>
		</div>

		<div id=ruler-box>
			<div class=ruler-corner>
				<b>Ruler</b>
				<small>sec · bar · rate · loop</small>
			</div>
			<canvas id=ruler aria-label="Musical ruler. Click or drag to seek."></canvas>
		</div>

		<div id=tl>
			<div id=heads-col>
				<ol id=heads aria-label="Track headers"></ol>
			</div>
			<div id=lanes>
				<div id=space></div>
				<div id=stage tabindex=0 role=region aria-label="DAW timeline piano roll. Use arrow keys to pan, + and − to zoom, Enter to seek to selected note.">
					<canvas id=roll></canvas>
					<canvas id=cur></canvas>
				</div>
			</div>
			<div id=sb-track><div id=sb-thumb></div></div>
			<div id=tip hidden></div>
			<div id=empty><p>Select a game and song to view its DAW timeline.</p></div>
		</div>
	</main>

	<!-- right inspector -->
	<aside id=insp aria-label="Inspector">
		<!-- radio-based tab switcher -->
		<input id=t-note type=radio name=tab checked>
		<input id=t-inst type=radio name=tab>
		<input id=t-mix  type=radio name=tab>
		<input id=t-song type=radio name=tab>
		<div class=tabs-nav role=tablist>
			<label for=t-note role=tab>Note / Voice</label>
			<label for=t-inst role=tab>Instruments</label>
			<label for=t-mix  role=tab>Mixer / FX</label>
			<label for=t-song role=tab>Song</label>
		</div>
		<section id=note-body class=tab-pane role=tabpanel aria-label="Note and voice inspector"></section>
		<section id=inst-body class=tab-pane role=tabpanel aria-label="Instruments and waveforms"></section>
		<section id=mix-body  class=tab-pane role=tabpanel aria-label="Mixer and effects timeline"></section>
		<section id=song-body class=tab-pane role=tabpanel aria-label="Song structure and sequences"></section>
	</aside>
</div>

<!-- bottom board: OTIS U31 voices, bus routing, ESP ES5510, DAC -->
<section id=board aria-label="Sound board live visualization">
	<svg id=board-svg viewBox="0 0 1200 116" preserveAspectRatio="xMidYMid meet">
		<!-- soldermask ground planes -->
		<!-- U31 OTIS ES5505 (voices 0..31) -->
		<g id=otis-chip>
			<rect class=chip-rect x=6 y=6 width=344 height=104 rx=4 />
			<text class=silktxt x=14 y=20>U31 · Ensoniq OTIS ES5505 (32 voices)</text>
			<text class=silksub x=340 y=20 text-anchor=end>29762 Hz</text>
			<!-- 32 voice cells (16x2) -->
			<g id=vcells></g>
		</g>

		<!-- Traces from OTIS to bus pairs -->
		<path class=trace d="M 350,42 L 390,42" />
		<path class=trace d="M 350,58 L 390,58" />
		<path class=trace d="M 350,74 L 390,74" />
		<path class=trace d="M 350,90 L 390,90" />

		<!-- Bus pairs P0..P3 -->
		<g id=buses-box>
			<rect class=chip-rect x=390 y=6 width=230 height=104 rx=4 />
			<text class=silktxt x=398 y=20>Bus Pairs → ESP Inputs</text>

			<text class=silksub x=400 y=38>P0 (0/1) silent</text>
			<rect class=m-bg x=520 y=30 width=44 height=8 rx=1 />

			<text class=silksub x=400 y=54>P1 (2/3) serio0 dry</text>
			<rect class=m-bg x=520 y=46 width=44 height=8 rx=1 />
			<rect id=m-p1 class=m-bar x=520 y=46 width=0 height=8 rx=1 />

			<text class=silksub x=400 y=70>P2 (4/5) serio1 verb/cho</text>
			<rect class=m-bg x=520 y=62 width=44 height=8 rx=1 />
			<rect id=m-p2 class=m-bar x=520 y=62 width=0 height=8 rx=1 />

			<text class=silksub x=400 y=86>P3 (6/7) serio2 send</text>
			<rect class=m-bg x=520 y=78 width=44 height=8 rx=1 />
			<rect id=m-p3 class=m-bar x=520 y=78 width=0 height=8 rx=1 />
		</g>

		<!-- Traces to ESP -->
		<path class=trace d="M 620,54 L 660,54" />
		<path class=trace d="M 620,70 L 660,70" />
		<path class=trace d="M 620,86 L 660,86" />

		<!-- U23 ESP ES5510 -->
		<g id=esp-chip>
			<rect class=chip-rect x=660 y=6 width=260 height=104 rx=4 />
			<text class=silktxt x=668 y=20>U23 · Ensoniq ESP ES5510</text>
			<text class=silksub x=668 y=36>Program:</text>
			<text id=esp-prog x=724 y=36 fill=#f8c830 font-family=var(--mono) font-size=10 font-weight=700>Mute</text>
			<text class=silksub x=668 y=54>serio0: dry · serio1: verb/cho/echo</text>
			<text class=silksub x=668 y=68>serio2: reverb send · serio3: → DAC</text>
			<text class=silksub x=668 y=86>Input gain: 0.18 · Output boost: 12.0</text>
		</g>

		<!-- Traces from ESP serio3 to DAC -->
		<path class=trace d="M 920,60 L 960,60" />

		<!-- DAC output -->
		<g id=dac-box>
			<rect class=chip-rect x=960 y=6 width=234 height=104 rx=4 />
			<text class=silktxt x=968 y=20>DAC · Stereo Output</text>
			<text class=silksub x=968 y=34>DAC channel order (PCB L/R)</text>

			<text class=silksub x=968 y=56>OUT L</text>
			<rect class=m-bg x=1010 y=48 width=48 height=10 rx=1 />
			<rect id=m-dac0 class=m-bar x=1010 y=48 width=0 height=10 rx=1 />

			<text class=silksub x=968 y=74>OUT R</text>
			<rect class=m-bg x=1010 y=66 width=48 height=10 rx=1 />
			<rect id=m-dac1 class="m-bar r" x=1010 y=66 width=0 height=10 rx=1 />

			<text class=silksub x=968 y=96>SingleStage gain model</text>
		</g>
	</svg>
</section>

<footer>
	<output id=status data-kind=ok>ready</output>
	<div class=ft-r>
		<span>ES5505 29762 Hz</span>
		<span>Taito F3 Sound System</span>
	</div>
</footer>

<script type=module src=app.js></script>
