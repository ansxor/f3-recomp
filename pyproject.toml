[project]
name = "f3-recomp"
version = "0.1.0"
description = "Statically recompiled Taito F3 runtime and recompiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone==5.0.9",
]

[project.scripts]
f3 = "tools.cli:main"

[dependency-groups]
analysis = [
    "numpy",
    "scipy",
]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "recomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
