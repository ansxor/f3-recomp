name: Runtime tests

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'runtime/**'
      - 'include/**'
      - 'games/**'
      - 'recomp/**'
      - 'tools/**'
      - 'tests/**'
      - 'netplay/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'runtime/**'
      - 'include/**'
      - 'games/**'
      - 'recomp/**'
      - 'tools/**'
      - 'tests/**'
      - 'netplay/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # commandw opts into game video; bubblemj has no video/ directory and uses the generic path.
        game: [commandw, bubblemj]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Configure
        run: nix develop -c cmake -S . -B build -G Ninja -DF3_GAME=${{ matrix.game }} -DF3RT_SDL=OFF -DF3RT_GPU=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build runtime unit tests
        run: nix develop -c cmake --build build --target f3rt-test-video f3rt-test-input f3rt-test-input_script f3rt-test-bytes f3rt-test-cpu f3rt-test-sprites f3rt-test-state f3rt-test-netplay f3-netplay-server f3-netplay-relay-test f3rt-tool
      - name: Run runtime unit tests
        run: nix develop -c ctest --test-dir build -R '^(runtime-|netplay-relay\.)' --output-on-failure
      - name: Run ROM-free MCP smoke tests
        run: nix develop -c ctest --test-dir build -R '^f3-mcp-smoke$' --no-tests=error --output-on-failure

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run Python tests
        run: uv run pytest

  recompiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and test the OCaml recompiler
        run: nix develop -c bash -c 'dune build --root recomp && dune test --root recomp'
